name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # DB efímera en disco (mejor que :memory: para tests con TestClient)
          DATABASE_URL: sqlite:///./ci.db
          # Secret válido (>=32 chars) para que el validate_security() no rompa
          JWT_SECRET: ci-test-secret-with-more-than-32-characters-of-entropy
          EMAIL_BACKEND: console
          ENV: dev
        run: pytest -v

  frontend:
    name: Frontend (vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  security:
    name: Security (deps audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      # pip-audit: falla solo si hay vulnerabilidades HIGH o CRITICAL.
      # Bajas/moderadas se reportan pero no rompen el build.
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip-audit -r requirements.txt --strict --vulnerability-service osv \
            --ignore-vuln PYSEC-2022-43012 \
            || (echo "::warning::pip-audit encontró vulnerabilidades"; pip-audit -r requirements.txt --vulnerability-service osv)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # npm audit: nivel "high" como gate, "moderate" como warning.
      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high --production || exit 1
          npm audit --audit-level=moderate --production || echo "::warning::npm audit encontró vulnerabilidades moderate"
